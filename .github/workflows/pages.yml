name: Test and deploy Juku Follow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required app features
        run: |
          test -s index.html
          grep -q "Juku Follow" index.html
          grep -q "localStorage" index.html
          grep -q "授業記録" index.html
          grep -q "宿題" index.html
          grep -q "要対応" index.html
          grep -q "window.__JUKU_FOLLOW__" index.html
          grep -q "生徒を削除" enhancements.js
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('inline script not found')
          open('/tmp/juku-follow-app.js', 'w', encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/juku-follow-app.js
          node --check enhancements.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html enhancements.js _site/
          python3 - <<'PY'
          path = '_site/index.html'
          html = open(path, encoding='utf-8').read()
          html = html.replace('</body>', '<script src="enhancements.js"></script>\n</body>')
          open(path, 'w', encoding='utf-8').write(html)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
