<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>Juku Follow</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#252737;--muted:#74788a;--line:#e6e8ef;--p:#5e5bd7;--ps:#eeedff;--warn:#d98225;--ws:#fff3e5;--danger:#d64b58;--ds:#fff0f1;--ok:#2f9467;--os:#eaf8f1;--r:18px;--shadow:0 12px 32px rgba(45,48,75,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}aside{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:32px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#7975e8,#4f4cc5);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{display:block}.brand small{color:var(--muted)}nav{display:grid;gap:8px}.nav{border:0;background:transparent;border-radius:12px;padding:13px 14px;text-align:left;color:#686b79;font-weight:750}.nav.active,.nav:hover{background:var(--ps);color:#4b48bd}.demo-note{margin-top:auto;padding:15px;border-radius:14px;border:1px solid #deddf8;background:#f8f7ff;font-size:12px;line-height:1.6;color:#74758b}.demo-note strong{color:#4b48bd}main{min-width:0;padding:30px clamp(20px,4vw,52px) 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}.eyebrow{margin:0;color:var(--p);font-size:11px;letter-spacing:.13em;font-weight:850}.top h1{margin:4px 0 0;font-size:clamp(27px,3vw,36px);letter-spacing:-.04em}.actions,.card-actions{display:flex;gap:9px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:780}.btn.primary{background:var(--p);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#5f6270}.btn.danger{background:var(--ds);color:var(--danger)}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel,.student-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.stat{padding:19px}.stat b{display:block;font-size:30px;margin-top:11px}.stat span{color:var(--muted);font-size:13px}.stat i{font-style:normal;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--ps);color:var(--p);font-weight:900}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.75fr);gap:20px}.panel-head{padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between}.panel-head h2{margin:4px 0 0;font-size:19px}.count{font-size:12px;color:var(--muted);background:#f7f8fc;padding:5px 9px;border-radius:999px}.list{padding:0 14px 14px;display:grid;gap:9px}.lesson{display:grid;grid-template-columns:60px 40px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}.avatar{width:40px;height:40px;border-radius:12px;background:var(--ps);color:#4d4ab8;display:grid;place-items:center;font-weight:900}.lesson strong,.attention strong{display:block;font-size:14px}.lesson small,.attention small{color:var(--muted)}.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f5f6fa;color:#676a78;font-size:11px;font-weight:750}.pill.warn{background:var(--ws);color:#a45d14}.pill.danger{background:var(--ds);color:var(--danger)}.pill.ok{background:var(--os);color:var(--ok)}.small{border:1px solid #deddf8;background:#f8f7ff;color:#4b48bd;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800}.attention{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;justify-content:space-between}.recent{margin-top:20px}.records{padding:0 14px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.record{border:1px solid var(--line);border-radius:13px;padding:14px}.record header{display:flex;justify-content:space-between;gap:8px}.record h3{margin:0;font-size:14px}.record time{font-size:11px;color:var(--muted)}.record p{font-size:12px;color:#5f6270;line-height:1.6}.toolbar{padding:13px;margin-bottom:15px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{flex:1 1 250px;display:flex;align-items:center;border:1px solid var(--line);background:#f8f9fc;border-radius:11px;padding:0 11px}.search input{width:100%;border:0;background:transparent;outline:0;padding:10px}.toolbar select{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.students{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.student-card{padding:17px}.student-card header{display:flex;justify-content:space-between;align-items:flex-start}.identity{display:flex;gap:10px;align-items:center}.student-card h3{margin:0;font-size:16px}.student-card small{color:var(--muted)}.meta{margin:14px 0;padding:11px;border-radius:11px;background:#f7f8fc;font-size:12px;line-height:1.7}.card-actions button{flex:1}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse;min-width:720px}.table-wrap th{background:#f7f8fc;color:var(--muted);font-size:11px;letter-spacing:.07em;text-align:left;padding:13px 15px}.table-wrap td{border-top:1px solid var(--line);padding:13px 15px;font-size:13px}.table-wrap td strong{display:block}.table-wrap td small{color:var(--muted)}.status{border:1px solid var(--line);border-radius:9px;padding:7px;background:#fff}.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}dialog{width:min(680px,calc(100vw - 28px));max-height:calc(100vh - 28px);border:0;border-radius:20px;padding:0;box-shadow:0 30px 70px rgba(27,29,48,.25)}dialog::backdrop{background:rgba(26,28,44,.45);backdrop-filter:blur(3px)}dialog form,.detail{padding:22px}.modal-head{display:flex;justify-content:space-between;gap:14px;margin-bottom:18px}.modal-head h2{margin:4px 0 0}.x{border:0;width:35px;height:35px;border-radius:10px;background:#f5f6fa;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid label,.form-grid fieldset{display:grid;gap:6px;font-size:12px;font-weight:750;color:#626575}.full{grid-column:1/-1}.form-grid input,.form-grid select,.form-grid textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.form-grid fieldset{border:0;padding:0;margin:0}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg input{position:absolute;opacity:0}.seg span{display:block;text-align:center;padding:9px;border:1px solid var(--line);border-radius:10px}.seg input:checked+span{border-color:var(--p);background:var(--ps);color:#4b48bd}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.detail-info{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.detail-info div{background:#f7f8fc;border-radius:11px;padding:11px;font-size:12px}.history{display:grid;gap:8px}.history article{border:1px solid var(--line);border-radius:11px;padding:12px}.history header{display:flex;justify-content:space-between}.history p{font-size:12px;color:#626575;line-height:1.6}.toast{position:fixed;right:18px;bottom:18px;background:#343646;color:#fff;padding:11px 14px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.students{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.shell{display:block;padding-bottom:72px}aside{position:fixed;z-index:10;top:auto;bottom:0;left:0;right:0;height:70px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line)}.brand,.demo-note{display:none}nav{grid-template-columns:repeat(3,1fr)}.nav{text-align:center;padding:10px 4px;font-size:11px}main{padding:20px 14px 30px}.top{align-items:flex-start}.actions{flex-direction:column-reverse}.actions .btn{font-size:12px;padding:9px}.lesson{grid-template-columns:54px 38px minmax(0,1fr)}.lesson .small{grid-column:1/-1}.records,.students{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.seg{grid-template-columns:1fr}.detail-info{grid-template-columns:1fr}}@media(max-width:430px){.top{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;margin-top:12px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
<aside><div class="brand"><span class="logo">JF</span><div><strong>Juku Follow</strong><small>講師用デモ</small></div></div><nav><button class="nav active" data-view="dashboard">⌂ ダッシュボード</button><button class="nav" data-view="students">人 生徒</button><button class="nav" data-view="homework">✓ 宿題</button></nav><div class="demo-note"><strong>デモモード</strong><br>すべて架空データです。入力内容はこの端末のブラウザ内だけに保存されます。</div></aside>
<main>
<header class="top"><div><p class="eyebrow" id="dateLabel"></p><h1 id="title">ダッシュボード</h1></div><div class="actions"><button class="btn ghost" id="reset">初期データに戻す</button><button class="btn primary" id="quickRecord">＋ 授業記録</button></div></header>
<section class="view active" id="dashboard"><div class="stats" id="stats"></div><div class="grid"><section class="panel"><div class="panel-head"><div><p class="eyebrow">TODAY</p><h2>今日の授業</h2></div><span class="count" id="lessonCount"></span></div><div class="list" id="lessons"></div></section><section class="panel"><div class="panel-head"><div><p class="eyebrow" style="color:var(--warn)">FOLLOW UP</p><h2>要対応の生徒</h2></div></div><div class="list" id="attention"></div></section></div><section class="panel recent"><div class="panel-head"><div><p class="eyebrow">RECENT</p><h2>最近の授業記録</h2></div></div><div class="records" id="records"></div></section></section>
<section class="view" id="students"><div class="panel toolbar"><label class="search">⌕<input id="studentSearch" placeholder="生徒名・学年・教科で検索"></label><select id="gradeFilter"><option value="">すべての学年</option></select><label><input type="checkbox" id="attentionOnly"> 要対応のみ</label><button class="btn primary" id="addStudent">＋ 生徒を追加</button></div><div class="students" id="studentGrid"></div></section>
<section class="view" id="homework"><div class="panel toolbar"><label class="search">⌕<input id="homeworkSearch" placeholder="生徒名・宿題内容で検索"></label><select id="statusFilter"><option value="">すべての状態</option></select><button class="btn primary" id="addHomework">＋ 宿題を追加</button></div><div class="panel table-wrap"><table><thead><tr><th>生徒</th><th>教科・内容</th><th>期限</th><th>状態</th><th></th></tr></thead><tbody id="homeworkRows"></tbody></table></div></section>
</main></div>
<dialog id="recordDialog"><form id="recordForm"><div class="modal-head"><div><p class="eyebrow">LESSON NOTE</p><h2>授業記録を追加</h2></div><button type="button" class="x" data-close>×</button></div><div class="form-grid"><label>生徒<select name="studentId" required></select></label><label>日付<input name="date" type="date" required></label><label>教科<input name="subject" required></label><label class="full">今日扱った内容<input name="content" required></label><fieldset class="full"><legend>理解度</legend><div class="seg"><label><input type="radio" name="understanding" value="good" checked><span>理解できた</span></label><label><input type="radio" name="understanding" value="unsure"><span>一部不安</span></label><label><input type="radio" name="understanding" value="review"><span>要復習</span></label></div></fieldset><label class="full">授業中の様子<textarea name="behavior"></textarea></label><label class="full">宿題<textarea name="homeworkText"></textarea></label><label>宿題期限<input name="dueDate" type="date"></label><label class="full">次回対応<textarea name="nextAction"></textarea></label></div><div class="modal-actions"><button type="button" class="btn ghost" data-close>キャンセル</button><button class="btn primary">記録する</button></div></form></dialog>
<dialog id="studentDialog"><form id="studentForm"><input type="hidden" name="id"><div class="modal-head"><div><p class="eyebrow">STUDENT</p><h2 id="studentDialogTitle">生徒を追加</h2></div><button type="button" class="x" data-close>×</button></div><div class="form-grid"><label>氏名<input name="name" required></label><label>学年<input name="grade" required></label><label>教科<input name="subjects" required placeholder="数学, 英語"></label><label class="full">苦手分野<textarea name="weaknesses"></textarea></label><label class="full">使用教材<textarea name="materials"></textarea></label><label class="full">注意事項<textarea name="note"></textarea></label></div><div class="modal-actions"><button type="button" class="btn ghost" data-close>キャンセル</button><button class="btn primary">保存する</button></div></form></dialog>
<dialog id="homeworkDialog"><form id="homeworkForm"><div class="modal-head"><div><p class="eyebrow">HOMEWORK</p><h2>宿題を追加</h2></div><button type="button" class="x" data-close>×</button></div><div class="form-grid"><label>生徒<select name="studentId" required></select></label><label>教科<input name="subject" required></label><label class="full">宿題内容<input name="title" required></label><label>期限<input name="dueDate" type="date" required></label><label>状態<select name="status"><option value="unchecked">未確認</option><option value="done">完了</option><option value="partial">一部未完了</option><option value="missing">未提出</option></select></label></div><div class="modal-actions"><button type="button" class="btn ghost" data-close>キャンセル</button><button class="btn primary">追加する</button></div></form></dialog>
<dialog id="detailDialog"><div class="detail" id="detail"></div></dialog><div class="toast" id="toast"></div>
<script>
const KEY='juku-follow-state-v1',statusList=[['unchecked','未確認'],['done','完了'],['partial','一部未完了'],['missing','未提出']],under={good:'理解できた',unsure:'一部不安',review:'要復習'};const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function dk(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}function shift(n){const d=new Date();d.setDate(d.getDate()+n);return dk(d)}const today=dk();
function demo(){return{students:[{id:'s1',name:'山田 翔太',grade:'中学3年',subjects:['数学'],weaknesses:'二次関数の変域・図形との融合',materials:'新中学問題集 数学3年',note:'途中式を省略しやすい'},{id:'s2',name:'佐藤 美咲',grade:'中学2年',subjects:['英語'],weaknesses:'不定詞と動名詞の使い分け',materials:'Keyワーク 英語2年',note:'単語テストの声かけが必要'},{id:'s3',name:'中村 蓮',grade:'高校1年',subjects:['数学'],weaknesses:'場合の数の重複処理',materials:'Focus Gold 数学A',note:'理解は速い。演習量を確保する'},{id:'s4',name:'田中 結衣',grade:'中学3年',subjects:['英語'],weaknesses:'長文の指示語と段落要旨',materials:'速読英単語 入門編',note:'音読を宿題に含める'},{id:'s5',name:'伊藤 悠真',grade:'高校2年',subjects:['物理'],weaknesses:'力学的エネルギーと運動量の使い分け',materials:'良問の風',note:'図を描いてから式を立てる'}],lessons:[{id:'l1',studentId:'s1',date:today,time:'16:30',subject:'数学',topic:'二次関数の最大・最小'},{id:'l2',studentId:'s2',date:today,time:'17:40',subject:'英語',topic:'不定詞・動名詞'},{id:'l3',studentId:'s4',date:today,time:'19:00',subject:'英語',topic:'長文読解'},{id:'l4',studentId:'s5',date:shift(1),time:'18:20',subject:'物理',topic:'運動量保存則'}],homework:[{id:'h1',studentId:'s1',subject:'数学',title:'新中問 p.82 問1〜8',dueDate:today,status:'partial'},{id:'h2',studentId:'s2',subject:'英語',title:'Keyワーク p.44〜45',dueDate:today,status:'missing'},{id:'h3',studentId:'s3',subject:'数学',title:'Focus Gold 例題35〜39',dueDate:shift(1),status:'unchecked'},{id:'h4',studentId:'s4',subject:'英語',title:'長文1題＋音読3回',dueDate:today,status:'done'},{id:'h5',studentId:'s5',subject:'物理',title:'良問の風 例題20〜22',dueDate:shift(-1),status:'unchecked'}],records:[{id:'r1',studentId:'s5',date:shift(-6),subject:'物理',content:'力学的エネルギー保存',understanding:'review',behavior:'図を描かずに式を立てて混乱した',homeworkText:'良問の風 例題20〜22',nextAction:'運動量保存との使い分けを図で確認する'},{id:'r2',studentId:'s3',date:shift(-3),subject:'数学',content:'順列・組合せ',understanding:'good',behavior:'自力で解法を説明できた',homeworkText:'Focus Gold 例題35〜39',nextAction:''}]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.students)?x:demo()}catch{return demo()}}let state=load(),view='dashboard';function id(p){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function student(i){return state.students.find(s=>s.id===i)}function latest(i){return state.records.filter(r=>r.studentId===i).sort((a,b)=>b.date.localeCompare(a.date))[0]}function flags(i){const h=state.homework.filter(x=>x.studentId===i),r=latest(i),a=[];if(h.some(x=>x.status==='missing'))a.push('宿題未提出');else if(h.some(x=>x.status==='partial'))a.push('宿題一部未完了');if(h.some(x=>x.dueDate<today&&x.status!=='done'))a.push('期限超過');if(r?.understanding==='review')a.push('要復習');if(r?.nextAction?.trim())a.push('次回対応あり');if(state.lessons.some(x=>x.studentId===i&&x.date===today)&&!state.records.some(x=>x.studentId===i&&x.date===today))a.push('授業記録未入力');return[...new Set(a)]}function cls(x){return /未提出|期限超過|要復習/.test(x)?'danger':'warn'}function pill(x){return`<span class="pill ${cls(x)}">${esc(x)}</span>`}function fmt(d){return new Intl.DateTimeFormat('ja-JP',{month:'short',day:'numeric',weekday:'short'}).format(new Date(d+'T00:00:00'))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),1800)}function save(t){localStorage.setItem(KEY,JSON.stringify(state));render();if(t)toast(t)}
function render(){renderNav();renderOptions();renderDashboard();renderStudents();renderHomework()}function renderNav(){$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$$('.view').forEach(v=>v.classList.toggle('active',v.id===view));$('#title').textContent={dashboard:'ダッシュボード',students:'生徒管理',homework:'宿題管理'}[view]}
function renderDashboard(){const att=state.students.map(s=>({...s,f:flags(s.id)})).filter(s=>s.f.length).sort((a,b)=>b.f.length-a.f.length),less=state.lessons.filter(l=>l.date===today).sort((a,b)=>a.time.localeCompare(b.time)),stats=[['◷',less.length,'今日の授業'],['!',att.length,'要対応の生徒'],['×',state.homework.filter(h=>h.status==='missing').length,'宿題未提出'],['…',less.filter(l=>!state.records.some(r=>r.studentId===l.studentId&&r.date===today)).length,'授業記録未入力']];$('#stats').innerHTML=stats.map(x=>`<article class="stat"><i>${x[0]}</i><b>${x[1]}</b><span>${x[2]}</span></article>`).join('');$('#lessonCount').textContent=less.length+'件';$('#lessons').innerHTML=less.length?less.map(l=>{const s=student(l.studentId),f=flags(l.studentId);return`<article class="lesson"><b>${l.time}</b><span class="avatar">${esc(s?.name?.replace(/\s/g,'').slice(0,1)||'?')}</span><div><strong>${esc(s?.name||'削除済み')}</strong><small>${esc(l.subject)}・${esc(l.topic)}</small><div class="pills">${f.slice(0,2).map(pill).join('')}</div></div><button class="small" data-record="${l.studentId}" data-subject="${esc(l.subject)}">記録する</button></article>`}).join(''):'<div class="empty">今日の授業はありません。</div>';$('#attention').innerHTML=att.length?att.slice(0,6).map(s=>`<button class="attention" data-detail="${s.id}"><span><strong>${esc(s.name)}</strong><small>${esc(s.grade)}・${esc(s.subjects.join(' / '))}</small><span class="pills">${s.f.slice(0,3).map(pill).join('')}</span></span><span>›</span></button>`).join(''):'<div class="empty">要対応の生徒はいません。</div>';const rec=[...state.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);$('#records').innerHTML=rec.map(r=>`<article class="record"><header><h3>${esc(student(r.studentId)?.name||'削除済み')}</h3><time>${fmt(r.date)}</time></header><div class="pills"><span class="pill ${r.understanding==='good'?'ok':r.understanding==='review'?'danger':'warn'}">${under[r.understanding]}</span><span class="pill">${esc(r.subject)}</span></div><p>${esc(r.content)}</p></article>`).join('')||'<div class="empty">まだ記録がありません。</div>'}
function renderStudents(){const gs=[...new Set(state.students.map(s=>s.grade))].sort(),g=$('#gradeFilter'),old=g.value;g.innerHTML='<option value="">すべての学年</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');g.value=gs.includes(old)?old:'';const q=$('#studentSearch').value.toLowerCase(),only=$('#attentionOnly').checked,arr=state.students.filter(s=>(!q||[s.name,s.grade,...s.subjects,s.weaknesses].join(' ').toLowerCase().includes(q))&&(!g.value||s.grade===g.value)&&(!only||flags(s.id).length));$('#studentGrid').innerHTML=arr.length?arr.map(s=>{const f=flags(s.id);return`<article class="student-card"><header><div class="identity"><span class="avatar">${esc(s.name.replace(/\s/g,'').slice(0,1))}</span><div><h3>${esc(s.name)}</h3><small>${esc(s.grade)}・${esc(s.subjects.join(' / '))}</small></div></div><button class="x" data-edit="${s.id}">⋯</button></header><div class="pills">${f.length?f.slice(0,3).map(pill).join(''):'<span class="pill ok">順調</span>'}</div><div class="meta"><b>苦手：</b>${esc(s.weaknesses||'未登録')}<br><b>教材：</b>${esc(s.materials||'未登録')}</div><div class="card-actions"><button class="btn ghost" data-detail="${s.id}">詳細</button><button class="btn primary" data-record="${s.id}" data-subject="${esc(s.subjects[0]||'')}">授業記録</button></div></article>`}).join(''):'<div class="panel empty">条件に一致する生徒はいません。</div>'}
function renderHomework(){const f=$('#statusFilter');if(f.options.length===1)f.innerHTML+=$status();const q=$('#homeworkSearch').value.toLowerCase(),st=f.value,arr=[...state.homework].sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).filter(h=>{const s=student(h.studentId);return(!q||`${s?.name||''} ${h.subject} ${h.title}`.toLowerCase().includes(q))&&(!st||h.status===st)});$('#homeworkRows').innerHTML=arr.length?arr.map(h=>{const s=student(h.studentId),over=h.dueDate<today&&h.status!=='done';return`<tr><td><strong>${esc(s?.name||'削除済み')}</strong><small>${esc(s?.grade||'')}</small></td><td><strong>${esc(h.subject)}</strong><small>${esc(h.title)}</small></td><td><span class="pill ${over?'danger':''}">${fmt(h.dueDate)}${over?'・期限超過':''}</span></td><td><select class="status" data-status="${h.id}">${statusList.map(x=>`<option value="${x[0]}" ${x[0]===h.status?'selected':''}>${x[1]}</option>`).join('')}</select></td><td><button class="x" data-delhw="${h.id}">×</button></td></tr>`}).join(''):'<tr><td colspan="5" class="empty">条件に一致する宿題はありません。</td></tr>'}function $status(){return statusList.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}function renderOptions(){const o=state.students.map(s=>`<option value="${s.id}">${esc(s.name)}（${esc(s.grade)}）</option>`).join('');$('#recordForm [name=studentId]').innerHTML=o;$('#homeworkForm [name=studentId]').innerHTML=o}
function openRecord(i='',sub=''){const f=$('#recordForm');f.reset();f.date.value=today;f.dueDate.value=shift(7);if(i)f.studentId.value=i;f.subject.value=sub||student(f.studentId.value)?.subjects[0]||'';$('#recordDialog').showModal()}function openStudent(i=''){const f=$('#studentForm');f.reset();const s=student(i);$('#studentDialogTitle').textContent=s?'生徒を編集':'生徒を追加';if(s)Object.entries({...s,subjects:s.subjects.join(', ')}).forEach(([k,v])=>{if(f[k])f[k].value=v});$('#studentDialog').showModal()}function openHomework(i=''){const f=$('#homeworkForm');f.reset();f.dueDate.value=shift(7);if(i)f.studentId.value=i;f.subject.value=student(f.studentId.value)?.subjects[0]||'';$('#homeworkDialog').showModal()}function openDetail(i){const s=student(i);if(!s)return;const f=flags(i),hs=state.homework.filter(h=>h.studentId===i),rs=state.records.filter(r=>r.studentId===i).sort((a,b)=>b.date.localeCompare(a.date));$('#detail').innerHTML=`<div class="modal-head"><div><p class="eyebrow">STUDENT DETAIL</p><h2>${esc(s.name)}</h2><small>${esc(s.grade)}・${esc(s.subjects.join(' / '))}</small></div><button class="x" data-close>×</button></div><div class="pills">${f.length?f.map(pill).join(''):'<span class="pill ok">順調</span>'}</div><div class="detail-info"><div><small>苦手分野</small><br>${esc(s.weaknesses||'未登録')}</div><div><small>使用教材</small><br>${esc(s.materials||'未登録')}</div><div><small>注意事項</small><br>${esc(s.note||'未登録')}</div></div><h3>宿題</h3><div class="history">${hs.map(h=>`<article><header><b>${esc(h.title)}</b><span class="pill">${statusList.find(x=>x[0]===h.status)?.[1]}</span></header><p>${esc(h.subject)}・期限 ${fmt(h.dueDate)}</p></article>`).join('')||'<div class="empty">宿題はありません。</div>'}</div><h3>授業履歴</h3><div class="history">${rs.map(r=>`<article><header><b>${fmt(r.date)}・${esc(r.subject)}</b><span class="pill">${under[r.understanding]}</span></header><p>${esc(r.content)}${r.nextAction?'<br><b>次回：</b>'+esc(r.nextAction):''}</p></article>`).join('')||'<div class="empty">授業記録はありません。</div>'}</div><div class="modal-actions"><button class="btn ghost" data-addhw="${s.id}">宿題を追加</button><button class="btn primary" data-record="${s.id}" data-subject="${esc(s.subjects[0]||'')}">授業記録</button></div>`;$('#detailDialog').showModal()}
$('#recordForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));state.records.push({id:id('r'),studentId:d.studentId,date:d.date,subject:d.subject.trim(),content:d.content.trim(),understanding:d.understanding,behavior:d.behavior.trim(),homeworkText:d.homeworkText.trim(),nextAction:d.nextAction.trim()});if(d.homeworkText.trim())state.homework.push({id:id('h'),studentId:d.studentId,subject:d.subject.trim(),title:d.homeworkText.trim(),dueDate:d.dueDate||shift(7),status:'unchecked'});$('#recordDialog').close();save('授業記録を保存しました')});$('#studentForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget)),s={id:d.id||id('s'),name:d.name.trim(),grade:d.grade.trim(),subjects:d.subjects.split(/[,、]/).map(x=>x.trim()).filter(Boolean),weaknesses:d.weaknesses.trim(),materials:d.materials.trim(),note:d.note.trim()},n=state.students.findIndex(x=>x.id===s.id);n>=0?state.students[n]=s:state.students.push(s);$('#studentDialog').close();save(n>=0?'生徒情報を更新しました':'生徒を追加しました')});$('#homeworkForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));state.homework.push({id:id('h'),studentId:d.studentId,subject:d.subject.trim(),title:d.title.trim(),dueDate:d.dueDate,status:d.status});$('#homeworkDialog').close();save('宿題を追加しました')});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.close!==undefined)return t.closest('dialog')?.close();if(t.dataset.view){view=t.dataset.view;renderNav();scrollTo(0,0)}else if(t.dataset.record!==undefined){$('#detailDialog').open&&$('#detailDialog').close();openRecord(t.dataset.record,t.dataset.subject)}else if(t.dataset.detail)openDetail(t.dataset.detail);else if(t.dataset.edit)openStudent(t.dataset.edit);else if(t.dataset.addhw){$('#detailDialog').close();openHomework(t.dataset.addhw)}else if(t.dataset.delhw&&confirm('この宿題を削除しますか？')){state.homework=state.homework.filter(h=>h.id!==t.dataset.delhw);save('宿題を削除しました')}});document.addEventListener('change',e=>{if(e.target.dataset.status){const h=state.homework.find(x=>x.id===e.target.dataset.status);if(h){h.status=e.target.value;save('宿題の状態を更新しました')}}});$('#quickRecord').onclick=()=>openRecord();$('#addStudent').onclick=()=>openStudent();$('#addHomework').onclick=()=>openHomework();$('#reset').onclick=()=>{if(confirm('入力した内容を消して初期データに戻しますか？')){state=demo();save('初期データに戻しました')}};['studentSearch','gradeFilter','attentionOnly'].forEach(x=>$('#'+x).addEventListener(x==='studentSearch'?'input':'change',renderStudents));['homeworkSearch','statusFilter'].forEach(x=>$('#'+x).addEventListener(x==='homeworkSearch'?'input':'change',renderHomework));$('#dateLabel').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(today+'T00:00:00'));render();window.__JUKU_FOLLOW__={getState:()=>structuredClone(state)};
</script>
